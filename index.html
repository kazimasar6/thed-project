```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>job application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form_contanier">
      <div class="apply_box">
        <h1>job Application <span class="title_small"> (web) </span></h1>
        
        <form id="jobForm">
          <input type="hidden" name="access_key" value="e1f1e32b-47e6-4437-bc5c-214d6deb123e">
          <input type="hidden" name="subject" value="New Job Application">

          <div class="form_contanier">
            <div class="form_control">
              <label for="fname">first Name:</label>
              <input type="text" id="fname" name="first_name" placeholder="Enter first Name" required />
            </div> 
            <div class="form_control">
              <label for="lname">last Name:</label>
              <input type="text" id="lname" name="last_name" placeholder="Enter last Name" required />
            </div>  
            <div class="form_control">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" placeholder="Enter Email" required />
            </div>  
            <div class="form_control">
              <label for="job_role">job Role:</label>
              <select id="job_role" name="job_role" required>
                <option value="">select job Role</option>
                <option value="fronted">Fronted Developer</option>
                <option value="backand">backand Developer</option>
                <option value="full stack">Full Stack Developer</option>
                <option value="ui_ux">UI UX Developer</option>
              </select>  
            </div>
            <div class="kazim">
              <label for="Address">Address:</label>
              <textarea id="Address" name="address" rows="4" cols="50" placeholder="Enter Address"></textarea>
            </div> 
            <div class="form_control">
              <label for="city">city Name:</label>
              <input type="text" id="city" name="city" placeholder="Enter city Name..." />
            </div> 
            <div class="form_control">
              <label for="pincode">pincode:</label>
              <input type="number" name="pincode" id="pincode" placeholder="Enter pincode" />
            </div>
            <div class="form_control">
              <label for="date">Date:</label>
              <input type="date" name="date" id="date" value="2025-10-10" /> 
            </div>  
          
            <div class="button_cpntainer">
              <button type="submit" id="submitBtn">apply now</button>
            </div>
            <div id="result"></div>
          </div>
        </form>
      </div>
    </div>

<script>
const form = document.getElementById('jobForm');
const result = document.getElementById('result');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.innerText = "Sending...";
  btn.disabled = true;
  result.style.display = "block";
  result.innerHTML = "Please wait, submitting your application...";
  result.style.color = "blue";

  const formData = new FormData(form);

  try {
    const response = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (response.status === 200) {
      result.innerHTML = "✅ Success! Form submitted.";
      result.style.color = "green";
      result.style.background = "#d4edda";
      result.style.padding = "10px";
      result.style.borderRadius = "5px";
      form.reset();
    } else {
      result.innerHTML = "❌ " + data.message;
      result.style.color = "red";
      result.style.background = "#f8d7da";
      result.style.padding = "10px";
    }
  } catch (error) {
    result.innerHTML = "❌ Something went wrong! Check internet.";
    result.style.color = "red";
  }

  btn.innerText = "apply now";
  btn.disabled = false;

  setTimeout(() => {
    result.style.display = "none";
  }, 8000);
});
</script>

  </body>
</html>
