```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="form_contanier">
      <div class="apply_box">
        <h1>
          Job Application
          <span class="title_small">(web)</span>
        </h1>

        <form id="jobForm">
          <input
            type="hidden"
            name="access_key"
            value="e1f1e32b-47e6-4437-bc5c-214d6deb123e"
          />

          <input
            type="hidden"
            name="subject"
            value="New Job Application"
          />

          <div class="form_contanier">

            <div class="form_control">
              <label for="fname">First Name:</label>
              <input
                type="text"
                id="fname"
                name="first_name"
                placeholder="Enter first name"
                required
              />
            </div>

            <div class="form_control">
              <label for="lname">Last Name:</label>
              <input
                type="text"
                id="lname"
                name="last_name"
                placeholder="Enter last name"
                required
              />
            </div>

            <div class="form_control">
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
              />
            </div>

            <div class="form_control">
              <label for="job_role">Job Role:</label>
              <select id="job_role" name="job_role" required>
                <option value="">Select job role</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="full stack">Full Stack Developer</option>
                <option value="ui_ux">UI/UX Developer</option>
              </select>
            </div>

            <div class="kazim">
              <label for="Address">Address:</label>
              <textarea
                id="Address"
                name="address"
                rows="4"
                cols="50"
                placeholder="Enter address"
              ></textarea>
            </div>

            <div class="form_control">
              <label for="city">City Name:</label>
              <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter city name..."
              />
            </div>

            <div class="form_control">
              <label for="pincode">Pincode:</label>
              <input
                type="number"
                name="pincode"
                id="pincode"
                placeholder="Enter pincode"
              />
            </div>

            <div class="form_control">
              <label for="date">Date:</label>
              <input
                type="date"
                name="date"
                id="date"
              />
            </div>

            <div class="button_cpntainer">
              <button type="submit" id="submitBtn">
                Apply Now
              </button>
            </div>

            <div id="result"></div>

          </div>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById("jobForm");
      const result = document.getElementById("result");
      const btn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        btn.innerText = "Sending...";
        btn.disabled = true;

        result.style.display = "block";
        result.innerHTML = "Please wait, submitting your application...";
        result.style.color = "blue";

        const formData = new FormData(form);

        try {
          const response = await fetch(
            "https://api.web3forms.com/submit",
            {
              method: "POST",
              body: formData
            }
          );

          const data = await response.json();

          if (response.ok && data.success) {
            result.innerHTML =
              "Success! Your application has been submitted.";
            result.style.color = "green";
            result.style.background = "#d4edda";
            result.style.padding = "10px";
            result.style.borderRadius = "5px";

            form.reset();
          } else {
            result.innerHTML =
              "Error: " + (data.message || "Unable to submit the form.");

            result.style.color = "red";
            result.style.background = "#f8d7da";
            result.style.padding = "10px";
          }
        } catch (error) {
          result.innerHTML =
            "Something went wrong! Please check your internet connection.";

          result.style.color = "red";
        } finally {
          btn.innerText = "Apply Now";
          btn.disabled = false;

          setTimeout(() => {
            result.style.display = "none";
          }, 8000);
        }
      });
    </script>
  </body>
</html>
