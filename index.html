<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>job application</title>
    <link rel="stylesheet" href="style.css" class="css" />
  </head>
  <body>
    <div class=" form_contanier">
      <div class="apply_box">
        <h1>
          job Application
          <span class="title_small"> (web) </span>
        </h1>
        <form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="98-06496046e3f9">
          <div class="form_contanier">
          <div class="form_control">
            <label for="fname">first Name:</label>
            <input type="text" id="fname" placeholder="Enter first Name"" />
          </div> 
            <div class="form_control">
            <label for="lname">last Name:</label>
            <input type="text" id="lname" placeholder="Enter last Name"" />
          </div>  
          <div class="form_control">
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter Email Name"" />
          </div>  
           <div class="form_control">
            <label for="job_role">job Role:</label>
          <select id="job_role" name="job_role">
            <option value="">select job  Role</option>
            <option value="fronte">Fronted Developer</option>
             <option value="backan">backand Developer</option>
              <option value="full stack">Full Stack Developer</option>
               <option value="ui_ux">UI UX  Developer</option>
          </select>  
        </div>
          <div class="kazim">
            <label for="Address">Address:</label>
              <textarea id="Address" rows="4" cols="50" placeholder="Enter Address"></textarea>
          </div> 
            <div class="form_control">
            <label for="city Name">city Name:</label>
            <input type="text" id="city Name" placeholder="Enter city Name..."/>
          </div> 
           <div class="form_control">
            <label for="pincode">pincode:</label>
            <input type="number" name="pincode"  id="pincode" placeholder="Enter pincode Name" />
          </div>
          <div class="form_control">
            <label for="date">Date:</label>
            <input value="2010-09-10" type="date" name="date"  id="date" placeholder="Enter Name date" /> 
        </div>  
        <div class="form_control">
            <label for="upload">Upload your CV:</label>
            <input  type="file" name="upload"  id="upload" placeholde=" upload your CV" /> 
        </div>  
      
      <div class="button_cpntainer">
        <button  type="submit">apply now</button>
      </div>
      </div>
        </form>
      </div>
    </div>
  </body>
</html>
